[package]
name = "suho"
version = "0.2.0"
edition = "2021"
description = "SUHO Agent — CLI-native autonomous AI agent"
authors = ["SUHO AI Team"]
license = "MIT"

[[bin]]
name = "suho"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive", "color", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Terminal UI
ratatui = "0.28"
crossterm = "0.28"

# Configuration
toml = "0.8"
dirs = "5"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async channels / utilities
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# Ctrl+C handler
ctrlc = { version = "3", features = ["termination"] }

# UUID for task IDs
uuid = { version = "1", features = ["v4"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Process management (Unix only)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
